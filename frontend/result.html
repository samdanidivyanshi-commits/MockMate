<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockMate | Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="result">
  <div class="page-shell">
    <nav class="navbar">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark">M</span>
        <span>MockMate</span>
      </a>
      <div class="nav-actions">
        <a class="nav-link" href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>
        <button class="nav-link nav-button" id="logoutBtn" type="button">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </button>
      </div>
    </nav>

    <main class="results-layout">
      <section class="card result-hero">
        <div>
          <span class="eyebrow">Interview completed</span>
          <p id="resultCategoryLabel" class="track-chip track-chip-large">HR Interview Results</p>
          <h1>Your MockMate results are ready.</h1>
          <p>Review your answers, check the quick feedback, and practice again whenever you want.</p>
        </div>
        <div class="score-pill">
          <i class="fa-solid fa-chart-column"></i>
          <div>
            <span>Total Score</span>
            <strong id="scoreValue">0 / 150</strong>
          </div>
        </div>
      </section>

      <section id="resultList" class="results-grid"></section>

      <section class="result-actions">
        <a class="btn btn-secondary" href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Back to Dashboard
        </a>
        <button id="restartInterviewBtn" class="btn btn-primary" type="button">
          <i class="fa-solid fa-play"></i>
          Practice Again
        </button>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
